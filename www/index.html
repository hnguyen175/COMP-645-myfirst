<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
  <script src="cordova.js"></script>
  <script src="components/loader.js"></script>
  <script src="lib/onsenui/js/onsenui.min.js"></script>

  <link rel="stylesheet" href="components/loader.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsenui.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsen-css-components.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    ons.ready(function() {
      console.log("Onsen UI is ready!");
    });

    if (ons.platform.isIPhoneX()) {
      document.documentElement.setAttribute('onsflag-iphonex-portrait', '');
      document.documentElement.setAttribute('onsflag-iphonex-landscape', '');
    }
  </script>

  <script>
    function onShowIPClick() {
      const ipButton = document.getElementById('show-ip');
      fetch("https://api.ipify.org?format=json")
        .then(response => response.json())
        .then(data => alert(`Your IP address is: ${data.ip}`))
        .catch(error => console.error('Error fetching IP address:', error));
    };
  </script>
</head>
<body>
  <br />
  This is a template for Onsen UI app.

  <p></p>
  <input type="button" id="show-ip" value="Show IP Address!" onclick="onShowIPClick()"/>
</body>
</html>
