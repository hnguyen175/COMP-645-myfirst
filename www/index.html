<!DOCTYPE HTML>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src * data: gap: https://ssl.gstatic.com; style-src * 'unsafe-inline'; script-src * 'unsafe-inline' 'unsafe-eval'">
  <script src="cordova.js"></script>
  <script src="components/loader.js"></script>
  <script src="lib/onsenui/js/onsenui.min.js"></script>
  <script src="js/show-ip-button.js" defer></script>
  <script src="js/NavController.js"></script>

  <link rel="stylesheet" href="components/loader.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsenui.css">
  <link rel="stylesheet" href="lib/onsenui/css/onsen-css-components.css">
  <link rel="stylesheet" href="css/style.css">

  <script>
    ons.ready(function() {
      console.log("Onsen UI is ready!");
    });

    if (ons.platform.isIPhoneX()) {
      document.documentElement.setAttribute('onsflag-iphonex-portrait', '');
      document.documentElement.setAttribute('onsflag-iphonex-landscape', '');
    }
  </script>
</head>
<body>
  <br />

  <p></p>
  <!--input type="ons-button " id="btnShowIp" class="btn js-show-ip" value="Show IP Address!"/-->

  <section id="scWelcome">
  <header><h1>Welcome to my first Cordova App!!</h1></header>
  <main>
    <p>Click the button below to load the game!</p>
    <ons-button class="btn js-load-game" id="btnLoadGame" onclick="NavController.showSection('scLoadGame')">Load Game</ons-button>
  </section> <!-- Welcome Section -->

  <section id="scLoadGame">
    <header><h1>Load Game</h1></header>
    <ons-button class="btn js-load-game" id="btnBack" onclick="NavController.showSection('scWelcome')">Back to Welcome</ons-button> 
  </section> <!-- Load Game Section -->

  <section id="scGame">
    <header><h1>Game</h1></header>    
  </section> <!-- Game Section -->

</body>
</html>
