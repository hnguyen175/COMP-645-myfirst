<ons-carousel-item id="caiDrunkenTavern">

    </header>
    <div class="player-cards">
    </div>
    <div id="divDrunkenTavernVillain">
        <h2>Misterious Villain</h2>
        <div class="player-cards"></div>
    </div>
    <br>
    <div>
        <ons-button class="btn js-load-game" id="btnSTR">STR</ons-button>
        <ons-button class="btn js-load-game" id="btnSPD">SPD</ons-button>
        <ons-button class="btn js-load-game" id="btnMP">MP</ons-button>

    <div id="divDrunkenTavernChallenge">
    </div>

    <ons-button class="btn js-load-game" id="btnSaveGame">Save Game</ons-button>
